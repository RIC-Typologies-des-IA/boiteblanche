name: Validate and deploy Boîte Blanche

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR merge result and published artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # For pull_request, checkout uses GitHub's synthetic merge ref by default.
        # This validates the proposed result against the current target branch,
        # rather than validating the PR branch in isolation.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Check vendored Chart.js syntax
        run: node --check vendor/chart.js/chart.umd.min.js
      - name: Validate source tree
        run: python scripts/validate_site.py
      - name: Assemble the exact static-site layout
        run: python scripts/build_site.py
      - name: Validate assembled publication artifact
        run: |
          node --check dist/sw.js
          node --check dist/vendor/chart.js/chart.umd.min.js
          python scripts/validate_site.py dist
      # Upload from this job, then deploy in a dependent job. GitHub's artifact
      # listing can lag briefly after upload-pages-artifact has finalized.
      # Keeping upload and deploy in one job can therefore produce a false
      # "No artifacts named github-pages" failure.
      - name: Upload validated GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
