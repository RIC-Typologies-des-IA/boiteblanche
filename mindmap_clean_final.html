            const treeData = { name: "Technologies", children: [] };
            const categories = {};
            
            technologies.forEach(tech => {
                const category = tech["Catégorie"];
                if (!categories[category]) {
                    categories[category] = { name: category, children: [] };
                    treeData.children.push(categories[category]);
                }
                
                const acronym = tech["Acronyme"] && tech["Acronyme"] !== ".nan" ? tech["Acronyme"] : "";
                const nodeName = `${acronym ? "[" + acronym + "] " : ""}${tech["Nom FR"]}`;
                
                categories[category].children.push({
                    name: nodeName,
                    englishName: tech["Nom EN"],
                    maturite: tech["Maturité"],
                    maturiteLevel: maturiteMap[tech["Maturité"]] || 1,
                    definition: tech["Définition"],
                    justification: tech["Justification"]
                });
            });
            
            const margin = {top: 40, right: 120, bottom: 40, left: 120};
            const container = document.getElementById('tree');
            const width = container.clientWidth - margin.left - margin.right;
            const height = container.clientHeight - margin.top - margin.bottom;
            
            // Create zoom behavior
            zoom = d3.zoom()
                .scaleExtent([0.3, 2])
                .on('zoom', zoomed);
            
            svg = d3.select("#tree").append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .call(zoom)
                .append("g")
                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
            
            treemap = d3.tree().size([height, width]);
            
            root = d3.hierarchy(treeData);
            root.x0 = height / 2;
            root.y0 = 0;
            
            root.children.forEach(collapse);
            update(root);
            
            // Initial zoom to fit
            setTimeout(() => {
                const bounds = svg.node().getBBox();
                const fullWidth = bounds.width + margin.left + margin.right;
                const fullHeight = bounds.height + margin.top + margin.bottom;
                const scale = Math.min(
                    width / fullWidth,
                    height / fullHeight,
                    0.8
                );
                const translateX = width / 2 - (bounds.x + bounds.width / 2) * scale;
                const translateY = height / 2 - (bounds.y + bounds.height / 2) * scale;
                svg.transition().call(
                    zoom.transform,
                    d3.zoomIdentity.translate(translateX, translateY).scale(scale)
                );
            }, 500);
            
            // Set up buttons
            document.getElementById('expand-all').addEventListener('click', () => {
                expandAll(root);
                update(root);
                setTimeout(fitView, 300);
            });
            
            document.getElementById('collapse-all').addEventListener('click', () => {
                collapseAll(root);
                update(root);
                setTimeout(fitView, 300);
            });
            
            document.getElementById('fit-view').addEventListener('click', fitView);
            
            document.getElementById('zoom-in').addEventListener('click', () => {
                svg.transition().call(zoom.scaleBy, 1.2);
            });
            
            document.getElementById('zoom-out').addEventListener('click', () => {
                svg.transition().call(zoom.scaleBy, 0.8);
            });
            
            document.getElementById('zoom-reset').addEventListener('click', () => {
                svg.transition().call(zoom.transform, d3.zoomIdentity);
            });
        }
        
        function fitView() {
            const bounds = svg.node().getBBox();
            const container = document.getElementById('tree');
            const width = container.clientWidth;
            const height = container.clientHeight;
            const margin = {top: 40, right: 120, bottom: 40, left: 120};
            
            const fullWidth = bounds.width + margin.left + margin.right;
            const fullHeight = bounds.height + margin.top + margin.bottom;
            const scale = Math.min(
                (width - margin.left - margin.right) / fullWidth,
                (height - margin.top - margin.bottom) / fullHeight,
                0.8
            );
            const translateX = (width - bounds.width * scale) / 2 - bounds.x * scale;
            const translateY = (height - bounds.height * scale) / 2 - bounds.y * scale;
            
            svg.transition().call(
                zoom.transform,
                d3.zoomIdentity.translate(translateX, translateY).scale(scale)
            );
        }
        
        function zoomed(event) {
            svg.attr("transform", event.transform);
        }
        
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }
        
        function expandAll(d) {
            if (d._children) {
                d.children = d._children;
                d._children = null;
                d.children.forEach(expandAll);
            }
            if (d.children) {
                d.children.forEach(expandAll);
            }
        }
        
        function collapseAll(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapseAll);
                d.children = null;
            }
        }
        
        function update(source) {
            const treeData = treemap(root);
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);
            
            // Update nodes
            const node = svg.selectAll("g.node")
                .data(nodes, d => d.id || (d.id = ++i));
            
            const nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on("click", click)
                .on("mouseover", mouseover)
                .on("mouseout", mouseout);
            
            nodeEnter.append("circle")
                .attr("r", 1e-6)
                .style("fill", d => d._children ? "lightsteelblue" : "#fff")
                .style("stroke", d => {
                    if (d.depth === 0) return "#fff";
                    if (d.depth === 1) return "#2980b9";
                    if (d.data.maturiteLevel) {
                        const colors = ["#ff6b6b", "#feca57", "#48dbfb", "#5f27cd"];
                        return colors[d.data.maturiteLevel - 1];
                    }
                    return "steelblue";
                });
            
            nodeEnter.append("text")
                .attr("dy", ".35em")
                .attr("x", 0)
                .attr("text-anchor", "middle")
                .text(d => {
                    if (d.depth === 0) return d.data.name;
                    if (d.depth === 1) return d.data.name;
                    return d.data.name.replace(/\[.*?\]\s*/, '');
                })
                .style("fill-opacity", 1e-6)
                .attr("class", d => {
                    if (d.depth === 0) return "root";
                    if (d.depth === 1) return "category";
                    if (d.data.maturiteLevel) return `maturite-${d.data.maturiteLevel}`;
                    return "";
                });
            
            const nodeUpdate = node.merge(nodeEnter).transition()
                .duration(750)
                .attr("transform", d => `translate(${d.y},${d.x})`);
            
            nodeUpdate.select("circle")
                .attr("r", d => d.depth === 0 ? 15 : (d.depth === 1 ? 12 : 10))
                .style("fill", d => d._children ? "lightsteelblue" : (d.depth === 0 ? "#2c3e50" : "#fff"));
            
            nodeUpdate.select("text")
                .style("fill-opacity", 1);
            
            const nodeExit = node.exit().transition()
                .duration(750)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();
            
            nodeExit.select("circle").attr("r", 1e-6);
            nodeExit.select("text").style("fill-opacity", 1e-6);
            
            // Update links
            const link = svg.selectAll("path.link")
                .data(links, d => d.id);
            
            const linkEnter = link.enter().insert("path", "g")
                .attr("class", "link")
                .attr("d", d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });
            
            link.merge(linkEnter).transition()
                .duration(750)
                .attr("d", d => diagonal(d, d.parent));
            
            link.exit().transition()
                .duration(750)
                .attr("d", d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();
            
            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }
        
        function diagonal(s, d) {
            const path = `M ${s.y} ${s.x}
                           C ${(s.y + d.y) / 2} ${s.x},
                             ${(s.y + d.y) / 2} ${d.x},
                             ${d.y} ${d.x}`;
            return path;
        }
        
        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
        }
        
        function mouseover(event, d) {
            if (d.depth === 0) return;
            
            const tooltip = d3.select("#tooltip");
            let content = `<strong>${d.data.name.replace(/\[.*?\]\s*/, '')}</strong>`;
            
            if (d.depth > 1) {
                if (d.data.englishName) {
                    content += ` (${d.data.englishName})`;
                }
                if (d.data.definition) {
                    content += `<br><br><em>Définition:</em> ${d.data.definition}`;
                }
                if (d.data.justification) {
                    content += `<br><br><em>Justification:</em> ${d.data.justification}`;
                }
                if (d.data.maturite) {
                    content += `<br><br><em>Maturité:</em> ${d.data.maturite}`;
                }
            }
            
            tooltip.html(content)
                .style("visibility", "visible");
            
            // Position tooltip intelligently to stay on screen
            const tooltipWidth = 400;
            const tooltipHeight = tooltip.node().offsetHeight;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            let left = event.pageX + 15;
            let top = event.pageY + 15;
            
            // Adjust horizontal position if too far right
            if (left + tooltipWidth > windowWidth) {
                left = windowWidth - tooltipWidth - 20;
            }
            
            // Adjust vertical position if too far down
            if (top + tooltipHeight > windowHeight) {
                top = windowHeight - tooltipHeight - 20;
            }
            
            // Adjust vertical position if too far up
            if (top < 20) {
                top = 20;
            }
            
            tooltip.style("left", left + "px")
                  .style("top", top + "px");
        }
        
        function mouseout() {
            d3.select("#tooltip").style("visibility", "hidden");
        }
        
        // Initialize with all data
        buildTree();
    </script>
</body>
</html>
